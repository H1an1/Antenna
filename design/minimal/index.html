<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antenna - Minimal vs Full Comparison</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a; color: #f0f2f5;
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
        }

        h1 {
            text-align: center; font-size: 32px; font-weight: 700;
            margin-bottom: 8px; letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center; color: #8b95a1; font-size: 14px;
            margin-bottom: 48px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: #e35d25;
            text-align: center; margin-bottom: 24px;
        }

        .compare-row {
            display: flex; justify-content: center; gap: 32px;
            margin-bottom: 56px; flex-wrap: wrap;
        }

        .frame {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }

        .frame-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; color: #555b61;
        }

        .frame-label.minimal { color: #ff9d00; }

        iframe {
            width: 390px; height: 844px;
            border: 1px solid #2a2d31; border-radius: 12px;
            background: #121416;
        }
    </style>
</head>
<body>
    <h1>Antenna Design Comparison</h1>
    <p class="subtitle">Full instrument vs Minimal &mdash; same DNA, zero decoration</p>

    <!-- Profile -->
    <div class="section-title">Profile</div>
    <div class="compare-row">
        <div class="frame">
            <span class="frame-label">Full</span>
            <iframe src="../profile-mode.html"></iframe>
        </div>
        <div class="frame">
            <span class="frame-label minimal">Minimal</span>
            <iframe src="profile.html"></iframe>
        </div>
    </div>

    <!-- Nearby / Radar -->
    <div class="section-title">Nearby</div>
    <div class="compare-row">
        <div class="frame">
            <span class="frame-label">Full</span>
            <iframe src="../radar-mode.html"></iframe>
        </div>
        <div class="frame">
            <span class="frame-label minimal">Minimal</span>
            <iframe src="radar.html"></iframe>
        </div>
    </div>

    <!-- Matches -->
    <div class="section-title">Matches</div>
    <div class="compare-row">
        <div class="frame">
            <span class="frame-label">Full</span>
            <iframe src="../matches-mode.html"></iframe>
        </div>
        <div class="frame">
            <span class="frame-label minimal">Minimal</span>
            <iframe src="matches.html"></iframe>
        </div>
    </div>
</body></html>
