<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antenna - Nearby (Radar V2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --screen-dark: #121416;
            --surface: #1a1c1f;
            --surface-hover: #222528;
            --orange: #e35d25;
            --amber: #ff9d00;
            --white: #f0f2f5;
            --gray-1: #c8cdd3;
            --gray-2: #8b95a1;
            --gray-3: #555b61;
            --gray-4: #2a2d31;
            --alu-base: #cdd1d5;
            --alu-dark: #a8adb3;
            --alu-light: #e8ebed;
            --engrave: #555b61;
            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--alu-base);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: var(--font-ui);
        }

        .app {
            width: 100%; max-width: 460px; height: 100dvh;
            background: linear-gradient(160deg, var(--alu-light) 0%, var(--alu-base) 40%, var(--alu-dark) 100%);
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
        }

        .app::before {
            content: ""; position: absolute; inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.06"/></svg>');
            pointer-events: none; z-index: 0;
        }

        /* Top bar */
        .top-bar {
            padding: 20px 20px 16px; display: flex; align-items: center;
            justify-content: space-between; position: relative; z-index: 10;
        }

        .logo { display: flex; align-items: center; gap: 8px; }

        .logo-text {
            font-family: var(--font-mono); font-size: 13px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--engrave);
            text-shadow: 0 1px 0 rgba(255,255,255,0.7);
        }

        .led {
            width: 6px; height: 6px; border-radius: 50%;
            background: #00ff41;
            box-shadow: 0 0 6px #00ff41, inset 0 1px 1px rgba(0,0,0,0.3);
        }

        .range-pills { display: flex; gap: 4px; }

        .pill {
            font-family: var(--font-mono); font-size: 10px; font-weight: 500;
            padding: 5px 10px; border-radius: 20px;
            color: var(--engrave); background: transparent;
            border: none; cursor: pointer;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
        }

        .pill.active {
            background: rgba(0,0,0,0.08);
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.15), inset -1px -1px 2px rgba(255,255,255,0.4);
            color: var(--orange); text-shadow: none;
        }

        /* Radar area */
        .radar-wrap {
            position: relative; z-index: 5;
            padding: 0 14px;
            display: flex; justify-content: center; align-items: center;
        }

        .radar-container {
            position: relative;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #181a1d 0%, #101214 100%);
            border: 1px solid rgba(168, 173, 179, 0.3);
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Concentric rings */
        .radar-rings {
            position: absolute; inset: 0;
            border-radius: 50%;
        }

        .radar-rings::before,
        .radar-rings::after {
            content: ''; position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(240, 242, 245, 0.04);
        }

        .radar-rings::before {
            inset: 33%; /* inner ring */
        }

        .radar-rings::after {
            inset: 16%; /* middle ring */
        }

        .radar-ring-outer {
            position: absolute; inset: 2%;
            border-radius: 50%;
            border: 1px solid rgba(240, 242, 245, 0.03);
        }

        /* Crosshairs */
        .radar-cross {
            position: absolute; inset: 0;
        }

        .radar-cross::before,
        .radar-cross::after {
            content: ''; position: absolute;
            background: rgba(240, 242, 245, 0.03);
        }

        .radar-cross::before {
            width: 1px; height: 100%;
            left: 50%; top: 0;
        }

        .radar-cross::after {
            width: 100%; height: 1px;
            top: 50%; left: 0;
        }

        /* Subtle rotating gradient */
        .radar-sweep {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 340deg,
                rgba(227, 93, 37, 0.03) 355deg,
                transparent 360deg
            );
            animation: sweep-rotate 12s linear infinite;
        }

        @keyframes sweep-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Center dot (you) */
        .radar-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 8px var(--orange), 0 0 16px rgba(227, 93, 37, 0.3);
            z-index: 5;
        }

        /* Avatar on radar */
        .radar-avatar {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            gap: 3px;
            transition: transform 0.2s ease;
        }

        .radar-avatar:hover { transform: translate(-50%, -50%) scale(1.15); }

        .radar-avatar.active .avatar-dot {
            box-shadow: 0 0 12px var(--orange), 0 0 24px rgba(227, 93, 37, 0.4);
            border-color: var(--orange);
        }

        .avatar-dot {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--surface);
            border: 1.5px solid rgba(240, 242, 245, 0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            animation: avatar-pulse 3s ease-in-out infinite;
        }

        .signal-strong .avatar-dot {
            box-shadow: 0 0 10px rgba(227, 93, 37, 0.25), 0 0 20px rgba(227, 93, 37, 0.1);
            border-color: rgba(227, 93, 37, 0.3);
            animation-duration: 2.5s;
        }

        .signal-medium .avatar-dot {
            box-shadow: 0 0 6px rgba(255, 157, 0, 0.15), 0 0 12px rgba(255, 157, 0, 0.06);
            border-color: rgba(255, 157, 0, 0.2);
            animation-duration: 3.5s;
        }

        .signal-weak .avatar-dot {
            box-shadow: 0 0 4px rgba(139, 149, 161, 0.1);
            border-color: rgba(139, 149, 161, 0.15);
            animation-duration: 4.5s;
        }

        @keyframes avatar-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .avatar-dist {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--gray-2);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* Detail card area */
        .detail-area {
            flex: 1; padding: 12px 14px 0;
            position: relative; z-index: 5;
            display: flex; flex-direction: column;
            min-height: 0;
        }

        .detail-card {
            background: var(--screen-dark);
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(240, 242, 245, 0.04);
            position: relative;
            animation: card-in 0.3s ease;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-close {
            position: absolute; top: 12px; right: 14px;
            background: none; border: none;
            color: var(--gray-3); font-size: 14px;
            cursor: pointer; padding: 4px;
        }

        .detail-close:hover { color: var(--gray-2); }

        .detail-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 10px;
        }

        .detail-emoji {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            border: 1.5px solid rgba(227, 93, 37, 0.25);
        }

        .detail-name {
            font-size: 16px; font-weight: 600; color: var(--white);
            letter-spacing: 0.2px;
        }

        .detail-dist {
            font-family: var(--font-mono); font-size: 11px;
            color: var(--amber); letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .detail-bio {
            font-size: 13px; color: var(--gray-2); line-height: 1.5;
            margin-bottom: 10px;
        }

        .detail-reason {
            font-size: 12px; color: var(--gray-3); line-height: 1.5;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border-left: 2px solid var(--orange);
        }

        .detail-reason .kw {
            color: var(--orange); font-weight: 500;
        }

        .detail-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-bottom: 14px;
        }

        .tag {
            font-family: var(--font-mono); font-size: 10px;
            padding: 4px 8px; border-radius: 4px;
            background: rgba(227, 93, 37, 0.08);
            color: var(--gray-2); letter-spacing: 0.3px;
        }

        .detail-actions {
            display: flex; gap: 10px;
        }

        .btn {
            flex: 1; padding: 10px; border-radius: 8px;
            font-family: var(--font-ui); font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; letter-spacing: 0.3px;
        }

        .btn-skip {
            background: var(--surface);
            color: var(--gray-2);
        }

        .btn-connect {
            background: var(--orange);
            color: var(--white);
            box-shadow: 0 2px 8px rgba(227, 93, 37, 0.3);
        }

        .detail-hint {
            text-align: center; padding: 8px 0 0;
            font-size: 11px; color: var(--gray-3);
        }

        /* Bottom area */
        .bottom-area {
            padding: 10px 20px 12px; position: relative; z-index: 10;
        }

        .tab-bar {
            display: flex; justify-content: center; gap: 32px;
            padding: 10px 0 8px;
        }

        .tab {
            font-family: var(--font-mono); font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--gray-3); position: relative;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            cursor: pointer; padding-bottom: 6px;
        }

        .tab.active { color: var(--engrave); }

        .tab.active::after {
            content: ''; position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 6px var(--orange);
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="top-bar">
            <div class="logo">
                <span class="logo-text">Antenna</span>
                <div class="led"></div>
            </div>
            <div class="range-pills">
                <button class="pill">200m</button>
                <button class="pill active">500m</button>
                <button class="pill">1km</button>
            </div>
        </header>

        <!-- Radar -->
        <div class="radar-wrap">
            <div class="radar-container">
                <div class="radar-rings"></div>
                <div class="radar-ring-outer"></div>
                <div class="radar-cross"></div>
                <div class="radar-sweep"></div>
                <div class="radar-center"></div>

                <!-- Marcus Chen ~120m — strong, close to center -->
                <div class="radar-avatar signal-strong" data-person="0"
                     style="top: 38%; left: 58%;">
                    <div class="avatar-dot">🛠</div>
                    <span class="avatar-dist">~120m</span>
                </div>

                <!-- Luna Park ~200m — strong-medium -->
                <div class="radar-avatar signal-strong" data-person="3"
                     style="top: 62%; left: 36%;">
                    <div class="avatar-dot">🎵</div>
                    <span class="avatar-dist">~200m</span>
                </div>

                <!-- Sora Kim ~340m — medium -->
                <div class="radar-avatar signal-medium" data-person="1"
                     style="top: 28%; left: 32%;">
                    <div class="avatar-dot">🎨</div>
                    <span class="avatar-dist">~340m</span>
                </div>

                <!-- Alex Rivera ~480m — medium-weak -->
                <div class="radar-avatar signal-medium" data-person="2"
                     style="top: 72%; left: 72%;">
                    <div class="avatar-dot">🧬</div>
                    <span class="avatar-dist">~480m</span>
                </div>

                <!-- Dev Patel ~700m — weak, near edge -->
                <div class="radar-avatar signal-weak" data-person="4"
                     style="top: 14%; left: 68%;">
                    <div class="avatar-dot">⚡</div>
                    <span class="avatar-dist">~700m</span>
                </div>
            </div>
        </div>

        <!-- Detail card -->
        <div class="detail-area" id="detailArea">
            <!-- Populated by JS -->
        </div>

        <nav class="bottom-area">
            <div class="tab-bar">
                <span class="tab">Profile</span>
                <span class="tab active">Nearby</span>
                <span class="tab">Matches</span>
            </div>
        </nav>
    </div>

    <script>
        const people = [
            {
                emoji: '🛠', name: 'Marcus Chen', dist: '~120m',
                bio: 'Protocol engineer obsessed with how autonomous agents discover and talk to each other.',
                reason: 'You both work on <span class="kw">agent-to-agent protocols</span> — Marcus is building an open registry for agent capabilities.',
                tags: ['protocols', 'multi-agent', 'p2p']
            },
            {
                emoji: '🎨', name: 'Sora Kim', dist: '~340m',
                bio: 'Interaction designer exploring what interfaces look like when AI is the primary user.',
                reason: 'Your interest in <span class="kw">AI-native UI patterns</span> overlaps — Sora is prototyping adaptive interfaces that reshape around context.',
                tags: ['design', 'ai-native', 'interfaces']
            },
            {
                emoji: '🧬', name: 'Alex Rivera', dist: '~480m',
                bio: 'Building a startup around personal AI memory — giving people ownership of their digital context.',
                reason: 'Your work connects to <span class="kw">personal AI memory</span> — Alex is tackling the storage and retrieval side of lifelong context.',
                tags: ['memory', 'startup', 'context']
            },
            {
                emoji: '🎵', name: 'Luna Park', dist: '~200m',
                bio: 'Sound artist and creative technologist blending generative music with spatial computing.',
                reason: 'Shared interest in <span class="kw">generative music × spatial audio</span> — Luna performs live sets where the venue shapes the sound.',
                tags: ['audio', 'spatial', 'generative']
            },
            {
                emoji: '⚡', name: 'Dev Patel', dist: '~700m',
                bio: 'Systems engineer pushing compute to the edge for real-time IoT sensor networks.',
                reason: 'Overlap in <span class="kw">edge computing for IoT</span> — Dev is working on sub-10ms inference at the network edge.',
                tags: ['edge', 'iot', 'systems']
            }
        ];

        const detailArea = document.getElementById('detailArea');
        const avatars = document.querySelectorAll('.radar-avatar');
        let activeIdx = 0;

        function renderDetail(idx, showHint) {
            const p = people[idx];
            activeIdx = idx;

            // Update active avatar
            avatars.forEach(a => a.classList.remove('active'));
            avatars.forEach(a => {
                if (parseInt(a.dataset.person) === idx) a.classList.add('active');
            });

            detailArea.innerHTML = `
                <div class="detail-card">
                    <button class="detail-close" onclick="closeDetail()">✕</button>
                    <div class="detail-header">
                        <div class="detail-emoji">${p.emoji}</div>
                        <div>
                            <div class="detail-name">${p.name}</div>
                            <div class="detail-dist">${p.dist}</div>
                        </div>
                    </div>
                    <div class="detail-bio">${p.bio}</div>
                    <div class="detail-reason">${p.reason}</div>
                    <div class="detail-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    <div class="detail-actions">
                        <button class="btn btn-skip">Skip</button>
                        <button class="btn btn-connect">Connect</button>
                    </div>
                </div>
                ${showHint ? '<div class="detail-hint">Tap anyone on the radar</div>' : ''}
            `;
        }

        function closeDetail() {
            avatars.forEach(a => a.classList.remove('active'));
            detailArea.innerHTML = '<div class="detail-hint">Tap anyone on the radar</div>';
        }

        // Click handlers
        avatars.forEach(a => {
            a.addEventListener('click', () => {
                renderDetail(parseInt(a.dataset.person), false);
            });
        });

        // Show closest person by default
        renderDetail(0, true);
    </script>
</body></html>
